[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-maker"
version = "0.1.0"
description = "Turn large texts into audiobooks using Microsoft Edge neural TTS voices"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "edge-tts>=7.2.0",
]

[project.scripts]
audiobook = "audiobook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
